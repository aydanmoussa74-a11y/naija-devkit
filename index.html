<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181d">
  <meta name="description" content="Offline phone workspace for files, Markdown, and local labs.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DevKit">
  <title>Naija DevKit</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#home">Skip</a>
  <section id="home" class="home">
    <header class="topbar">
      <button class="icon-btn" id="home-menu" type="button" aria-label="Open menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <strong class="wordmark">Naija DevKit</strong>
      <button class="icon-btn" id="home-search-btn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="home-scroll">
      <div id="welcome" class="welcome is-hidden">
        <p class="kicker">0.0.1</p>
        <h1>Welcome to Naija DevKit</h1>
        <p>Files stay on this phone. Start a file or import one from Downloads.</p>
        <div class="row">
          <button class="primary" id="btn-start" type="button">Start coding</button>
          <button class="ghost" id="btn-import-home" type="button">Import files</button>
        </div>
      </div>
      <div id="hub" class="hub is-hidden">
        <button class="search-launch" id="search-launch" type="button">Search files, snippets...</button>
        <h2>Recent</h2>
        <div id="home-recents" class="list"></div>
        <h2>Lab</h2>
        <div class="lab-grid">
          <button class="lab-card" data-lab="snippets" type="button"><span>Snippets</span><small>Reuse bits</small></button>
          <button class="lab-card" data-lab="regex" type="button"><span>Regex Test</span><small>Match locally</small></button>
          <button class="lab-card" data-lab="json" type="button"><span>JSON Lab</span><small>Pretty / fix</small></button>
          <button class="lab-card" data-lab="vibe" type="button"><span>Vibe</span><small>Write and run</small></button>
        </div>
        <h2>Workspace</h2>
        <p class="muted" id="home-summary">No files yet.</p>
        <div class="row">
          <button class="primary" id="btn-open-ide" type="button">Open IDE</button>
          <button class="ghost" id="btn-import-hub" type="button">Import</button>
        </div>
      </div>
    </div>
  </section>
  <section id="ide" class="ide is-hidden">
    <header class="ide-top">
      <button class="icon-btn" id="ide-back" type="button" aria-label="Back to home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="ide-folder" type="button" aria-label="Explorer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="tabs" id="tabs"></div>
      <select id="view-mode" aria-label="Editor mode">
        <option value="code">Code</option>
        <option value="text">Text</option>
        <option value="markdown">Markdown</option>
      </select>
      <button class="icon-btn" id="btn-preview" type="button" aria-label="Preview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h3l-5 8h3M16 8h3l-5 8h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="editor-stage">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <div class="chips" id="chips" aria-label="Insert"></div>
  </section>
  <aside id="sidebar" class="sidebar" hidden>
    <div class="scrim" id="sidebar-scrim"></div>
    <nav class="panel" aria-label="Menu">
      <div id="side-ide" class="side-block">
        <p class="side-label">Explorer</p>
        <div class="side-head">
          <span>Opened Files</span>
          <button class="tiny" id="btn-new-file" type="button">+</button>
        </div>
        <div id="opened-list" class="side-list"></div>
        <div class="side-head"><span>Recent Files</span></div>
        <div id="recent-list" class="side-list"></div>
        <div class="side-head"><span>Workspace</span></div>
        <div id="tree-list" class="side-list"></div>
        <div class="side-head"><span>Outline</span></div>
        <div id="outline-list" class="side-list"></div>
      </div>
      <div class="side-nav">
        <button class="side-row" data-go="home" type="button"><span class="dot d1"></span> Workspace</button>
        <button class="side-row" data-go="lab" type="button"><span class="dot d2"></span> Lab</button>
        <button class="side-row" data-go="ai" type="button"><span class="dot d3"></span> AI Assistant</button>
        <button class="side-row" data-go="settings" type="button"><span class="dot d4"></span> Settings</button>
        <button class="side-row" data-go="extensions" type="button"><span class="dot d5"></span> Extensions Hub<span class="soon">soon</span></button>
        <button class="side-row" data-go="github" type="button"><span class="dot d6"></span> GitHub</button>
      </div>
      <p class="version">Naija DevKit 0.0.1</p>
    </nav>
  </aside>
  <section id="search" class="search-full" hidden>
    <header class="topbar">
      <button class="icon-btn" id="search-back" type="button" aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <input id="search-input" type="search" placeholder="Search files..." autocomplete="off">
    </header>
    <div id="search-results" class="list"></div>
  </section>
  <section id="sheet" class="sheet" hidden>
    <header class="sheet-top">
      <button class="icon-btn" id="sheet-back" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <strong id="sheet-title">Sheet</strong>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
  </section>
  <input id="file-input" type="file" hidden multiple accept=".html,.css,.js,.ts,.py,.md,.json,.txt,text/*">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
