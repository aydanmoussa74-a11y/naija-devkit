<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">
  <meta name="description" content="Offline-first phone workspace. Files stay on this device.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DevKit">
  <title>Naija DevKit</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#home">Skip to home</a>
  <section id="welcome" class="page" hidden>
    <div class="welcome-body">
      <p class="kicker">Local · Offline · 0.0.1</p>
      <h1>Welcome to Naija DevKit</h1>
      <p class="lead">A phone workspace that keeps working when the radio drops. Files live on this device.</p>
      <div class="row">
        <button class="primary" id="btn-start" type="button">Start a file</button>
        <button class="ghost" id="btn-import-welcome" type="button">Import from device</button>
      </div>
    </div>
  </section>
  <section id="home" class="page has-dock" hidden>
    <header class="topbar">
      <strong class="wordmark">Naija DevKit</strong>
      <span class="ver-pill">0.0.1</span>
    </header>
    <div class="page-body">
      <button class="cmd" id="home-cmd" type="button" aria-label="Search or jump">
        <span class="cmd-prompt">&gt;_</span>
        <span>Search or jump…</span>
      </button>
      <div id="home-resume"></div>
      <h2 class="section-label">Toolbox</h2>
      <div class="tool-grid" id="home-tools"></div>
      <h2 class="section-label">Recent</h2>
      <div id="home-recents" class="file-list"></div>
    </div>
  </section>
  <section id="workspace" class="page has-dock" hidden>
    <header class="topbar">
      <strong class="wordmark">Workspace</strong>
      <button class="icon-btn" id="ws-search" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="ws-import" type="button" aria-label="Import">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v10M8 9l4-4 4 4M6 19h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="ws-new" type="button" aria-label="New file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="page-body">
      <div class="strip" id="ws-strip"></div>
      <div class="filters" id="ws-filters" role="tablist" aria-label="File type"></div>
      <div id="ws-list" class="file-list"></div>
    </div>
  </section>
  <section id="toolbox" class="page has-dock" hidden>
    <header class="topbar"><strong class="wordmark">Toolbox</strong></header>
    <div class="page-body">
      <div class="tool-grid" id="box-tools"></div>
      <h2 class="section-label">Recently opened</h2>
      <div id="box-recents" class="file-list"></div>
    </div>
  </section>
  <section id="settings" class="page has-dock" hidden>
    <header class="topbar"><strong class="wordmark">Settings</strong></header>
    <div class="page-body settings-body" id="settings-body"></div>
  </section>
  <section id="editor" class="page page-editor" hidden>
    <header class="ide-top">
      <button class="icon-btn" id="ed-back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="ed-files" type="button" aria-label="Files">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="file-switch" id="ed-name" type="button">untitled</button>
      <span class="dirty" id="ed-dirty" hidden></span>
      <button class="play-btn" id="ed-play" type="button" aria-label="Run preview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5v11l10-5.5z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="ed-more" type="button" aria-label="More">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>
      </button>
    </header>
    <div class="editor-stage" id="editor-stage">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" enterkeyhint="enter"></textarea>
    </div>
    <div class="chip-sheet" id="chip-sheet">
      <button class="grab" id="chip-toggle" type="button" aria-label="Toggle insert rail"></button>
      <div class="chips" id="chips" aria-label="Insert"></div>
    </div>
  </section>
  <section id="preview" class="page page-preview" hidden>
    <header class="topbar">
      <button class="icon-btn" id="pv-back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <strong class="wordmark" id="pv-title">Preview</strong>
      <button class="icon-btn" id="pv-reload" type="button" aria-label="Reload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <div id="pv-stage" class="preview-stage"></div>
    <p class="preview-log" id="pv-log" hidden></p>
  </section>
  <section id="search" class="page" hidden>
    <header class="topbar">
      <button class="icon-btn" id="search-back" type="button" aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input id="search-input" type="search" placeholder="Search files" autocomplete="off">
    </header>
    <div id="search-results" class="page-body file-list"></div>
  </section>
  <section id="ai" class="page" hidden>
    <header class="topbar">
      <button class="icon-btn" id="ai-back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <strong class="wordmark">Assistant</strong>
    </header>
    <div class="page-body ai-body">
      <p class="muted" id="ai-hint"></p>
      <div id="ai-log" class="ai-log"></div>
      <label class="check"><input id="ai-inc" type="checkbox" checked> Include active file</label>
      <textarea id="ai-in" rows="3" placeholder="Ask about the open file"></textarea>
      <button class="primary" id="ai-send" type="button">Send</button>
    </div>
  </section>
  <section id="tool" class="page" hidden>
    <header class="topbar">
      <button class="icon-btn" id="tool-back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <strong class="wordmark" id="tool-title">Tool</strong>
    </header>
    <div class="page-body" id="tool-body"></div>
  </section>
  <nav class="dock" id="dock" hidden aria-label="Places">
    <button type="button" data-go="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Home</button>
    <button type="button" data-go="workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7v5H4zm9 0h7v10h-7zM4 14h7v4H4z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Workspace</button>
    <button type="button" data-go="toolbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h8v3H8zm-2 3h12v8H6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Toolbox</button>
    <button type="button" data-go="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2M6.6 6.6l1.4 1.4M16 16l1.4 1.4M17.4 6.6 16 8M8 16l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Settings</button>
  </nav>
  <aside id="drawer" class="drawer" hidden>
    <div class="scrim" id="drawer-scrim"></div>
    <nav class="panel" aria-label="Open files">
      <div class="panel-brand"><strong>Files</strong><button class="text-btn" id="drawer-new" type="button">New</button></div>
      <div id="drawer-open" class="side-list"></div>
      <h2 class="section-label pad">Workspace</h2>
      <div id="drawer-all" class="side-list"></div>
    </nav>
  </aside>
  <div id="actions" class="actions" hidden>
    <button type="button" data-act="code">Open as Code</button>
    <button type="button" data-act="markdown">Open as Markdown</button>
    <button type="button" data-act="text">Open as Text</button>
    <button type="button" data-act="download">Download</button>
    <button type="button" data-act="rename">Rename</button>
    <button type="button" data-act="ai">Assistant</button>
    <button type="button" data-act="close">Close file</button>
  </div>
  <input id="file-input" type="file" hidden multiple accept=".html,.css,.js,.ts,.py,.md,.json,.txt,text/*">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./ndk-core.js" defer></script>
  <script src="./ndk-ui.js" defer></script>
  <script src="./ndk-more.js" defer></script>
</body>
</html>
